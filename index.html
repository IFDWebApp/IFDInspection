<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Inspection & Maintenance System</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14284b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IFD PM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#14284b;overflow:hidden}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;
       padding-top:env(safe-area-inset-top)}
  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
          color:#fff;font:600 16px system-ui,sans-serif;gap:14px;background:#14284b;transition:opacity .4s}
  #splash img{width:96px;height:96px;border-radius:22px}
  #inst{position:fixed;inset:0;z-index:10;background:#14284b;color:#fff;display:none;align-items:center;justify-content:center;flex-direction:column;
        gap:14px;padding:24px;text-align:center;font:500 15px/1.6 system-ui,'Sarabun',sans-serif}
  #inst img{width:96px;height:96px;border-radius:22px}
  #inst h1{margin:0;font-size:20px}
  #inst button{font:700 16px system-ui,sans-serif;border:0;border-radius:12px;padding:13px 26px;background:#10b981;color:#fff;width:min(300px,100%)}
  #inst button.g{background:transparent;border:1px solid rgba(255,255,255,.4);font-weight:500}
  #inst .st{max-width:320px;text-align:left;background:rgba(255,255,255,.1);border-radius:12px;padding:12px 16px}
</style>
</head>
<body>
<div id="inst">
  <img src="icon-192.png" alt="">
  <h1>ติดตั้งแอป IFD PM</h1>
  <div id="inst-msg">เพิ่มแอปไว้บนหน้าจอหลักเพื่อเปิดใช้งานได้เร็วและเต็มจอ</div>
  <button id="inst-go" style="display:none">ติดตั้งแอปเลย</button>
  <div id="inst-ios" class="st" style="display:none">
    <div>1. แตะปุ่มแชร์ <b>⬆</b> ที่แถบล่างของ Safari</div>
    <div>2. เลือก <b>เพิ่มลงในหน้าจอหลัก</b></div>
    <div>3. แตะ <b>เพิ่ม</b></div>
  </div>
  <div id="inst-and" class="st" style="display:none">
    <div>แตะเมนู <b>⋮</b> มุมขวาบนของ Chrome แล้วเลือก <b>ติดตั้งแอป</b> หรือ <b>เพิ่มลงในหน้าจอหลัก</b></div>
  </div>
  <button class="g" id="inst-skip">เปิดใช้งานต่อโดยไม่ติดตั้ง</button>
</div>
<div id="splash"><img src="icon-192.png" alt=""><div>กำลังโหลด…</div></div>
<iframe id="app" title="Inspection & Maintenance System"
  allow="camera; microphone; geolocation; clipboard-write; clipboard-read; fullscreen; autoplay"></iframe>
<script>
  // ★ แก้บรรทัดนี้: ใส่ URL Web app ของ Apps Script (ลงท้าย /exec)
  var EXEC_URL = 'https://script.google.com/macros/s/AKfycbycMa8L7N12fxuVBEua6ArcepILYxcuPkojmEizB3pPy4-mJPkrIYIEL-BAhJ1IGMKw/exec/exec';

  var f = document.getElementById('app');

  // ---- หน้าติดตั้งอัตโนมัติ: เปิดด้วย ?install=1 (ปุ่มในตั้งค่าผู้ใช้ของแอปส่งมาที่นี่) ----
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var wantInstall = /[?&]install=1/.test(location.search) && !standalone;
  var dp = null, started = false;
  function $i(x) { return document.getElementById(x); }
  function startApp() {
    if (started) return; started = true;
    $i('inst').style.display = 'none'; $i('splash').style.display = 'flex'; f.src = EXEC_URL;
  }
  if (wantInstall) {
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    $i('inst').style.display = 'flex'; $i('splash').style.display = 'none';
    if (ios) { $i('inst-ios').style.display = 'block'; }
    else {
      $i('inst-and').style.display = 'block';
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault(); dp = e;
        $i('inst-and').style.display = 'none'; $i('inst-go').style.display = 'block';
        $i('inst-msg').textContent = 'แตะปุ่มด้านล่างเพื่อติดตั้ง';
      });
      $i('inst-go').onclick = function () {
        if (!dp) return; dp.prompt();
        dp.userChoice.then(function () { dp = null; $i('inst-go').style.display = 'none'; startApp(); });
      };
    }
    window.addEventListener('appinstalled', function () { $i('inst-msg').textContent = 'ติดตั้งแล้ว! เปิดแอปจากไอคอนบนหน้าจอหลัก'; });
    $i('inst-skip').onclick = startApp;
  } else { f.src = EXEC_URL; }
  f.addEventListener('load', function () {
    setTimeout(function () { var s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(function () { s.remove(); }, 450); }, 600);
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
